<mat-tab-group class="tab-group">
  @for (symbol of favoriteSymbols; track symbol) {
    <mat-tab label="{{symbol}}" class="tab">
      <table
        mat-table
        [dataSource]="allMarket"
        class="mat-elevation-z8 market-table"
      >
        @for (nameColumn of displayedColumns; track $index) {
          <ng-container [matColumnDef]="nameColumn">
            <th mat-header-cell *matHeaderCellDef class="column-title">
              {{ nameColumn.charAt(0).toUpperCase() + nameColumn.slice(1) }}
            </th>
            <td mat-cell *matCellDef="let element" class="rows-text">
              {{ element[nameColumn] }}
            </td>
          </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </mat-tab>
  }
</mat-tab-group>
