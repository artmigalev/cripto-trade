<mat-tab-group>
  <mat-tab label="BTC">
    <table mat-table [dataSource]="allMarket" class="mat-elevation-z8">
      @for (nameColumn of displayedColumns; track $index) {
        <ng-container [matColumnDef]="nameColumn">
          <th mat-header-cell *matHeaderCellDef class="column-title">
            {{ nameColumn.charAt(0).toUpperCase() + nameColumn.slice(1) }}
          </th>
          <td mat-cell *matCellDef="let element">
            {{ element[nameColumn] }}
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </mat-tab>
  <mat-tab label="TabTabHeader2">
    <p>Content for Tab 2</p>
  </mat-tab>
</mat-tab-group>
