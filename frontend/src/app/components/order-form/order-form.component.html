<section class="order-section">
  <!-- <h2 class="section-title">{{ title }}</h2> -->
  <form [formRoot]="formOrder" class="order-form">
    <div class="side-container">
      <button
        type="button"
        class="btn-side buy"
        [class.active]="activeSide() === orderSide.Buy"
        (click)="setSide(orderSide.Buy)">
        Buy
      </button>
      <button
        type="button"
        class="btn-side sell"
        [class.active]="activeSide() === orderSide.Sell"
        (click)="setSide(orderSide.Sell)">
        Sell
      </button>
    </div>
    <fieldset class="form-field">
      <legend class="form-legend">Order Type</legend>
      <select
        class="form-select-type"
        [formField]="formOrder.type"
        (change)="onTypeChange($event)"
        aria-placeholder="order-type">
        <option selected disabled>Order Type</option>
        <option value="{{ orderType.MARKET }}">Market</option>
        <option value="{{ orderType.LIMIT }}">Limit</option>
      </select>
    </fieldset>
    <fieldset class="form-field">
      <legend class="form-legend">Amount</legend>
      <div class="amount-container">
        <input
          [formField]="formOrder.quantity"
          class="field-input amount-input"
          type="text"
          [appHintBalance]="balance()!" />
        <span class="balance">$ {{ balance()! | converter: 'USDT' }}</span>
      </div>
      @for (error of formOrder.quantity().errors(); track $index) {
        <p class="error-msg">{{ error.message }}</p>
      }
    </fieldset>
    @if (formOrder.type().value() === orderType.LIMIT) {
      <fieldset class="form-field">
        <legend class="form-legend">Price</legend>
        <input
          [formField]="formOrder.price"
          class="field-input price-input"
          type="text" />
        @for (error of formOrder.price().errors(); track $index) {
          <p class="error-msg">{{ error.message }}</p>
        }
      </fieldset>
    }
    <button class="btn-form btn-send" type="submit">Send</button>
  </form>
</section>
