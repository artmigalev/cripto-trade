<mat-card class="dashboard-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title class="card-title">{{ card().symbol }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <ul>
      <li class="card-item">
        <span class="label">Price:</span>
        <span class="value">{{ card().currentPrice | converter: card().symbol }} </span>
      </li>
      <li class="card-item">
        <span class="label"> 24h change:</span>
        <span class="value" appHighlight="{{ card().change24h }}" class="value"
          >{{ card().change24h }} %</span
        >
      </li>
      <li class="card-item">
        <span class="label">Volume:</span>
        <span class="value">{{ card().volume }}</span>
      </li>
    </ul>
  </mat-card-content>
  <mat-card-actions>
    <button [disabled]="isFavorite()" class="btn-card favorite-btn" matButton (click)="toggle()">
      Add to favorites
    </button>
  </mat-card-actions>
</mat-card>

<!-- Card shows: pair symbol, current price, 24h change (percentage), volume. -->
