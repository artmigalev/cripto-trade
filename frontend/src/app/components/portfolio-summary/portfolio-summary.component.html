<section class="portfolio-summary layout-page">
  @defer (on viewport) {
    <app-widget type="portfolio-value" [data]="balance()" />
    <h2 class="text-2xl font-bold">Main Assets</h2>

    <app-table [schema]="tableSchema()" />
  } @placeholder (minimum 800ms) {
    <list-content-loader
      [viewBox]="'0 0 100 100'"
      [style]="{ width: '100%', height: '100%' }" />
  } @error {}
</section>
