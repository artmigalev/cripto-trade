<mat-nav-list class="">
  <ul class="flex">
    @for (item of navList; track $index) {
      <li>
        <a
          mat-list-item
          href="{{ item.link }}"
          routerLinkActive="activeLink"
          [routerLinkActiveOptions]="{ exact: true }"
          [routerLink]="item.link"
        >
          {{ item.title }}
        </a>
      </li>
    }
  </ul>
</mat-nav-list>
