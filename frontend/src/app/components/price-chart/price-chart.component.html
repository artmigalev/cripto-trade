<section class="container-section price-chart">
  <div class="chart" #chart></div>
  <div class="chart-controls">
    @for (interval of candleIntervals; track $index) {
      <button
        class="button-interval"
        (click)="btnToggleInterval(interval)"
        [attr.id]="interval === _activeInterval() ? 'active' : null">
        {{ interval }}
      </button>
    }
  </div>
</section>
