<section class="overview layout-page">
  <h2 class="title section-title">Top Pairs</h2>
  @if (!topCards() || topCards()?.length === 0) {
    <h2 class="text-center text-2xl">Tickers not found</h2>
  } @else {
    <ul class="card-list">
      @for (card of topCards(); track card.currentPrice) {
        <li class="list-item">
          <app-market-card [ticker]="card" />
        </li>
      }
    </ul>
  }
</section>
