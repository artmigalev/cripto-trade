<section class="dashboard">
  @if (isLoad()) {
    <div>Loading...</div>
  } @else if (error()) {
    <div>{{ error() }}</div>
  } @else {
    <app-market-overview [topCards]="topCards()" />
    <div class="flex flex-row w-full gap-4">
      <app-watch-list [favoritePairs]="watchList()" />
      <app-portfolio-summary [totalPortfolioValue]="portfolioSummary" />
    </div>
  }
</section>
