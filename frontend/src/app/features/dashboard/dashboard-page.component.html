<section class="dashboard layout-page">
  @defer {
    <app-market-overview [topCards]="topCards()" />
    <div class="dash-container">
      <app-watch-list [favoritePairs]="watchList()" />
      <app-portfolio-summary
        [tableSchema]="schemaTable()"
        [balance]="balance()" />
    </div>
  } @placeholder (minimum 800ms) {
    <app-spinner />
  } @error {
    <span>{{ error() }}</span>
  }
</section>
